<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>حِسبة — Demo v19</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ec;--card:#fff;--chip:#efe8d8;--dark:#1f3326;--ink:#1f3326;--cream:#f7f4ec;--gold:#c8a470;--green:#3d7a4a;--mid:#4a6548;--red:#c0504a;--muted:#6b7a6e;--line:#e6e0d2;--yel:#e8c25a;--yelT:#f8ecc0;--redT:#f4d3cf;--beige:#e9dcc0;--sage:#d9e4d0;--cream2:#f3ecdc}
html[data-theme=dark]{--bg:#111a14;--card:#1b2a20;--chip:#243629;--dark:#3b5e47;--ink:#eee6d2;--cream:#eee6d2;--mid:#2e4a36;--muted:#9fb3a2;--line:#34483a;--beige:#5b4a2c;--sage:#2d3b2f;--cream2:#2a3a2e;--yelT:#4a4220;--redT:#4a2a27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#e9e4d8;font-family:Tajawal,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:420px;min-height:100vh;background:var(--bg);overflow-x:hidden;position:relative;padding-bottom:30px}
button{font-family:Tajawal;cursor:pointer}
input,select{font:700 16px Tajawal;width:100%;padding:13px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin:4px 0 10px;min-width:0;display:block}
input[type=checkbox]{width:auto;display:inline-block;margin:0 6px 0 0}
details{margin:6px 0 10px}details summary{color:var(--muted);font-weight:700;padding:6px 0}
.lbl{display:block;color:var(--muted);font-size:15px;margin:8px 0 2px}
.chk{display:block;font-size:17px;margin:8px 0}
header{position:sticky;top:0;z-index:5;background:var(--dark);color:var(--cream);display:flex;align-items:center;gap:10px;padding:12px 14px}
header .ht{flex:1}
header #ttl{font-size:22px;font-weight:800;display:block;line-height:1.1}
header small{opacity:.8;font-size:14px}
.back{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.12);display:none;align-items:center;justify-content:center;font-size:22px;cursor:pointer;color:var(--cream);border:0}
.ic{width:42px;height:42px;border-radius:21px;background:rgba(255,255,255,.12);border:0;font-size:20px;cursor:pointer}
.offline{display:none;background:#8a5a2b;color:#fff;text-align:center;padding:8px;font-size:15px}
.offline.on{display:block}
.screen{padding:16px 16px 40px}
.h2{font:800 24px Tajawal;margin:4px 0 12px}
.sech{font:800 19px Tajawal;margin:18px 0 8px}
.note{color:var(--muted);font-size:15px;margin:6px 0}
.btn{display:block;width:100%;background:var(--dark);color:var(--cream);border:0;border-radius:16px;padding:15px;font:800 19px Tajawal;margin:8px 0;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--dark)}
.btn.red{background:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--chip);border-radius:20px;padding:9px 14px;font:700 16px Tajawal;cursor:pointer;border:2px solid transparent;color:var(--ink)}
.chip.on{background:var(--dark);color:var(--cream)}
.search{margin:8px 0}
.sumbox{background:var(--card);border-radius:18px;padding:14px;margin:10px 0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:17px}
.line:last-child{border-bottom:0}
.line small{color:var(--muted)}
.bigBox{background:var(--card);border-radius:20px;padding:18px;text-align:center;margin:10px 0}
.bigBox small{color:var(--muted);font-size:16px;display:block}
.bigBox b{font:800 36px Tajawal}
.stat{background:var(--card);border-radius:18px;padding:14px;cursor:pointer}
.stat small{color:var(--muted);font-size:15px;display:block}
.stat b{font:800 23px Tajawal;display:block;margin-top:4px}
.stat.good b{color:var(--green)}.stat.bad b{color:var(--red)}
.wide{grid-column:1/3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
/* home */
.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drw{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:14px;margin:10px 0;cursor:pointer}
.drw small{color:var(--muted);font-size:15px;display:block}
.drw b{font:800 24px Tajawal}
.drw span{color:var(--gold);font-weight:800}
.warn{background:var(--redT);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.t{border:0;border-radius:20px;padding:18px 10px;text-align:center;font:800 19px Tajawal;color:var(--ink);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
.t i{display:block;font-style:normal;font-size:32px;margin-bottom:6px}
.c-in{background:var(--mid);color:var(--cream)}
.c-out{background:var(--sage)}
.c-sell{background:var(--gold);color:var(--dark);font-size:24px;padding:24px}
.c-ppl{background:var(--cream2)}
.c-mach{background:var(--dark);color:var(--cream)}
.c-inv{background:var(--beige);color:var(--dark)}
.link{display:block;margin:18px auto;background:none;border:0;color:var(--muted);font:700 17px Tajawal}
/* product cards */
.sellTop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scanBig{background:var(--gold);color:var(--dark);border:0;border-radius:18px;padding:16px 8px;font:800 19px Tajawal}
.creditBtn{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 8px;font:800 18px Tajawal;color:var(--ink)}
.creditBtn.on{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.credBox{background:var(--card);border-radius:16px;padding:10px 12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pcard{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pcard .em{font-size:34px}
.pcard small{color:var(--muted);font-size:15px}
.pcard .st{color:var(--ink);font-weight:700}
.pcard b{font-size:18px;line-height:1.2}
.pcard.yel{background:var(--yelT);border-color:var(--yel)}
.pcard.red{background:var(--redT);border-color:var(--red);opacity:.85}
.row{background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;display:flex;align-items:center;gap:12px;cursor:pointer}
.row .em{font-size:30px}
.row .t{flex:1;min-width:0}
.row .t b{font-size:19px;display:block}
.row .t small{color:var(--muted);font-size:15px}
.row.yel{background:var(--yelT)}
.row.red{background:var(--redT)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mcard{background:var(--card);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer}
.mcard span{font-size:30px;display:block}
.mcard b{font-size:18px;display:block}
.mcard big{font:800 22px Tajawal;display:block;color:var(--green)}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:52px;height:52px;border-radius:16px;border:0;background:var(--chip);font:800 26px Tajawal;color:var(--ink)}
.qty input{text-align:center;margin:0;font-size:22px}
.x{background:none;border:0;color:var(--red);font-size:20px;padding:6px}
.swrow{background:var(--card);border-radius:16px;padding:10px;margin:8px 0}
.unit{align-self:center;color:var(--muted)}
.msg{padding:12px 14px;border-radius:16px;margin:8px 0;max-width:88%;font-size:18px;line-height:1.5}
.msg.u{background:var(--dark);color:var(--cream);margin-inline-start:auto}
.msg.b{background:var(--card)}
.chatIn{display:flex;gap:8px;position:sticky;bottom:10px;margin-top:10px}
.chatIn input{margin:0}
.chatIn button{background:var(--gold);border:0;border-radius:14px;padding:0 16px;font:800 17px Tajawal}
.big{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:0;border-radius:20px;padding:18px;margin-bottom:12px;font:800 22px Tajawal;color:var(--ink);cursor:pointer}
.big i{font-style:normal;font-size:28px;width:52px;height:52px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center}
.logo{font:800 40px Tajawal;text-align:center;margin-top:50px}
.logo-sub{text-align:center;color:var(--muted);margin-bottom:24px}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(20,30,24,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:420px;border-radius:26px 26px 0 0;padding:20px 18px 28px;max-height:88vh;overflow:auto}
.sheet h3{font:800 22px Tajawal;margin:0 0 6px}
#scanSheet{z-index:45}
#scanSheet video{width:100%;border-radius:16px;background:#000;min-height:200px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--cream);padding:12px 18px;border-radius:16px;font:800 17px Tajawal;z-index:60;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.toast button{pointer-events:auto;background:var(--gold);border:0;border-radius:12px;padding:6px 10px;margin-inline-start:8px;font:800 15px Tajawal;color:var(--dark)}
.logo-msg{text-align:center}
/* yellow/red legend */
.legend{display:flex;gap:8px;margin:6px 0;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:6px;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <header id="hdr" style="display:none">
    <button class="back" id="back" onclick="back()">→</button>
    <div class="ht"><b id="ttl" style="display:block;font-size:22px"></b><small id="shopN"></small></div>
    <button class="ic" id="thBtn" onclick="toggleTheme()" title="وضع ليلي">🌙</button>
  </header>
  <div class="offline" id="offBar">📴 مفيش نت — الشغل مستمر، وهيتحفظ لما النت يرجع</div>
  <main id="page" class="screen"></main>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetBody"></div></div>

<div class="sheet" id="scanSheet" onclick="if(event.target===this)endScan()"><div class="in">
  <h3>📷 امسح الباركود</h3>
  <video id="vid" playsinline muted></video>
  <div class="note" id="scanMsg"></div>
  <div id="scanFallback" style="display:none">
    <div class="lbl">اكتب الباركود</div>
    <input id="scanIn" inputmode="numeric" placeholder="مثلاً 6221000000011">
    <button class="btn" onclick="scanTyped()">تمام</button>
    <button class="btn ghost" onclick="scanDemo()">جرّب باركود تجريبي</button>
  </div>
  <button class="btn ghost" onclick="endScan()">إلغاء</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ================= Helpers ================= */
const $=id=>document.getElementById(id);
const DAY=864e5;
const fmt=n=>(Math.round((n||0)*100)/100)+' ج';
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayOff=n=>ymd(Date.now()+n*DAY);
const today=()=>ymd(Date.now());
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sumA=(L,f)=>L.reduce((a,x)=>a+(f?f(x):0),0);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EXP_CATS=['كهرباء','إيجار','نقل','مرتبات','صيانة','ميه وغاز','إنترنت وموبايل','ضرايب ورسوم','مصاريف شخصية','حاجة تانية'];

/* ================= البيانات (تجريبية) ================= */
const item=(id,name,em,bc,units,batches,min,extra={})=>({id,name,em,bc:bc||'',kind:'item',units,batches,min,...extra});
const B=(qty,exp)=>({id:uid(),qty,exp:exp||null});
let S={
  shop:'بقالة الأمل',
  products:[
    item('coca','كوكاكولا 1 لتر','🥤','6221000000011',[{l:'قطعة',b:1,p:15,c:11},{l:'كرتونة (12)',b:12,p:165,c:130}],[B(80,dayOff(200))],12),
    item('eish','عيش بلدي','🥖','',[{l:'رغيف',b:1,p:2,c:1.4}],[B(150,dayOff(0)),B(40,dayOff(12))],30),
    item('cheese','جبنة رومي','🧀','',[{l:'كيلو',b:1000,p:320,c:240}],[B(3500,dayOff(2))],500,{weight:true}),
    item('sugar','سكر 1 كيلو','🍚','6221000000033',[{l:'كيس',b:1,p:38,c:30}],[B(20,dayOff(300))],10),
    item('water','مياه 600 مل','💧','',[{l:'قطعة',b:1,p:7,c:5},{l:'كرتونة (12)',b:12,p:80,c:60}],[B(24,dayOff(90))],12),
    item('labna','لبنة 500 جرام','🫙','',[{l:'علبة',b:1,p:35,c:25}],[B(3,dayOff(2))],5),
    item('chips','شيبسي كبير','🥔','',[{l:'قطعة',b:1,p:12,c:9}],[B(0,null)],5),
    item('eggs','بيض (30)','🥚','',[{l:'طبق',b:1,p:110,c:95}],[B(4,dayOff(20))],3),
    {id:'sand',name:'سندوتش جبنة','em':'🥪',bc:'',kind:'sand',min:0,batches:[],parts:[{pid:'eish',q:1},{pid:'cheese',q:50}],markup:22,extra:0,units:[{l:'قطعة',b:1,p:0,c:0}]}
  ],
  people:[
    {id:'p1',name:'محمد',phone:'01012345678',kind:'cust',amt:450,dir:'they',supplies:[]},
    {id:'p2',name:'أحمد',phone:'01123456789',kind:'cust',amt:120,dir:'they',supplies:[]},
    {id:'p3',name:'شركة الألبان',phone:'01000000002',kind:'sup',amt:1500,dir:'me',supplies:['cheese']},
    {id:'p4',name:'توزيع الأمل',phone:'01000000003',kind:'sup',amt:0,dir:null,supplies:['water','coca']}
  ],
  machines:[{id:'m1',name:'فوري',bal:2000},{id:'m2',name:'أمان',bal:1200},{id:'vc',name:'فودافون كاش',bal:1500},{id:'ip',name:'إنستاباي',bal:800}],
  services:[
    {id:'insta',name:'تحويل إنستا باي',em:'📲',fee:5,ms:['ip','m1']},
    {id:'voda',name:'تحويل فودافون كاش',em:'📱',fee:5,ms:['vc']},
    {id:'bills',name:'شحن مرافق',em:'💡',fee:3,ms:['m2']}
  ],
  log:[],
  drawer:{base:500,since:Date.now()}
};
let CRED={on:false,name:'',phone:''};

/* ================= مصادر الحساب ================= */
const prod=id=>S.products.find(p=>p.id===id);
const mach=id=>S.machines.find(m=>m.id===id);
const svc=id=>S.services.find(s=>s.id===id);
const person=id=>S.people.find(p=>p.id===id);
const isComp=p=>p.kind!=='item';
const live=p=>p.batches.filter(b=>b.qty>0&&(!b.exp||b.exp>=today()));
const nearExp=p=>live(p).some(b=>b.exp&&b.exp<=dayOff(3));
const costPer=p=>p.units[0].c/p.units[0].b;
const sellPer=p=>p.units[0].p/p.units[0].b;
const aggParts=parts=>{const m={};parts.forEach(x=>m[x.pid]=(m[x.pid]||0)+x.q);return Object.keys(m).map(pid=>({pid,q:m[pid]}));};
const stockOf=p=>{
  if(!p)return 0;
  if(!isComp(p))return sumA(live(p),b=>b.qty);
  const parts=aggParts(p.parts||[]);
  if(!parts.length)return 0;
  return Math.min(...parts.map(x=>Math.floor(stockOf(prod(x.pid))/x.q)));
};
const stockTxt=p=>p.weight?(Math.round(stockOf(p)/10)/100)+' كيلو':stockOf(p)+' '+p.units[0].l;
const linkedMs=s=>s.ms.map(id=>mach(id)).filter(Boolean);
const cardCls=p=>{const s=stockOf(p);if(s<=0)return 'red';if(p.kind==='item'&&(s<=p.min||nearExp(p)))return 'yel';return '';};

function sync(){
  S.products.filter(isComp).forEach(p=>{
    const parts=aggParts(p.parts||[]);
    const cost=sumA(parts,x=>{const q=prod(x.pid);return q?x.q*costPer(q):0;});
    if(p.kind==='sand'){
      p.units[0].c=cost+(Number(p.extra)||0);
      p.units[0].p=sumA(parts,x=>{const q=prod(x.pid);return q?x.q*sellPer(q):0;})+(Number(p.markup)||0);
    }
    if(p.kind==='offer'){
      const T=offerMath(p.offer);
      p.units[0].c=cost;
      p.units[0].p=T.price;
    }
  });
}
function offerMath(O){
  const val=r=>{const q=prod(r.pid);const u=q&&q.units[r.ui];return u?r.qty*u.p:0;};
  const all=sumA(O.items,val),paid=sumA(O.items.filter(r=>!r.gift),val);
  let price;
  if(O.type==='pct')price=paid*(1-(O.pct||0)/100);
  else if(O.type==='gift')price=paid;
  else price=Number(O.price)||0;
  return{all,price,save:all-price};
}

/* ================= الدفع والدرج ================= */
const PSel={},PAYRE={};
function payChips(id,sel,exclude){
  return [['cash','💵 كاش']].concat(S.machines.filter(m=>m.id!==exclude).map(m=>[m.id,'💳 '+m.name]))
    .map(([k,l])=>`<span class="chip ${sel===k?'on':''}" onclick="pickPay('${id}','${k}')">${esc(l)}</span>`).join('');
}
function pickPay(id,k){PSel[id]=k;if(PAYRE[id])PAYRE[id]();}
function getPay(id){return PSel[id]||'cash';}

function drawerNow(){
  let cashIn=0,cashOut=0;
  S.log.forEach(e=>{
    if(e.t<=S.drawer.since||e.pay!=='cash')return;
    if(e.k==='sale')cashIn+=e.amt;
    else if(e.k==='pay'){if(e.inn)cashIn+=e.amt;else cashOut+=e.amt;}
    else if(e.k==='in')cashOut+=e.cost;
    else if(['ret','exp','topup'].includes(e.k))cashOut+=e.amt;
  });
  return{cashIn,cashOut,expected:S.drawer.base+cashIn-cashOut};
}
function sumOf(E){
  const SA=E.filter(e=>e.k==='sale'),RT=E.filter(e=>e.k==='ret'),EX=E.filter(e=>e.k==='exp'),WS=E.filter(e=>e.k==='waste');
  const sales=sumA(SA,e=>e.amt)-sumA(RT,e=>e.amt);
  const cogs=sumA(SA,e=>e.cost)-sumA(RT,e=>e.cost);
  const exp=sumA(EX,e=>e.amt),waste=sumA(WS,e=>e.amt);
  const bypay={cash:0,wallet:0,credit:0};
  SA.forEach(e=>{const k=e.pay==='cash'?'cash':e.pay==='credit'?'credit':'wallet';bypay[k]+=e.amt;});
  return{sales,cogs,profit:sales-cogs,exp,waste,gross:sales-cogs-exp-waste,bypay,n:SA.length};
}
function logE(e){e.t=e.t||Date.now();S.log.unshift(e);}

/* ================= تراجع ================= */
const HIST=[];
function snap(label){
  HIST.push({label,st:JSON.stringify({products:S.products,people:S.people,machines:S.machines,services:S.services,log:S.log,drawer:S.drawer})});
  if(HIST.length>30)HIST.shift();
}
function undo(){
  const h=HIST.pop();
  if(!h)return toast('مفيش حاجة تتراجع');
  Object.assign(S,JSON.parse(h.st));
  closeSheet();sync();render();toast('اتراجعت: '+h.label);
}

/* ================= مخزون: الدفعات (الأقرب صلاحية الأول) ================= */
const batchOrder=(a,b)=>{if(a.exp&&b.exp)return a.exp<b.exp?-1:a.exp>b.exp?1:0;if(a.exp)return -1;if(b.exp)return 1;return 0;};
function addBatch(p,qty,exp){if(qty>0)p.batches.push({id:uid(),qty,exp:exp||null});}
function take(p,base){
  let need=base;
  live(p).sort(batchOrder).forEach(b=>{if(need<=0)return;const t=Math.min(b.qty,need);b.qty-=t;need-=t;});
  p.batches=p.batches.filter(b=>b.qty>0);
}
function needOf(lines){
  const N={};
  lines.forEach(l=>{
    if(isComp(l.p))aggParts(l.p.parts||[]).forEach(x=>N[x.pid]=(N[x.pid]||0)+x.q*l.qty);
    else N[l.p.id]=(N[l.p.id]||0)+l.base;
  });
  return N;
}
const enough=N=>Object.keys(N).every(pid=>N[pid]<=stockOf(prod(pid)));
function consume(lines){
  lines.forEach(l=>{
    if(isComp(l.p))aggParts(l.p.parts||[]).forEach(x=>take(prod(x.pid),x.q*l.qty));
    else take(l.p,l.base);
  });
}
function restore(lines){
  lines.forEach(l=>{
    if(isComp(l.p))aggParts(l.p.parts||[]).forEach(x=>addBatch(prod(x.pid),x.q*l.qty,null));
    else addBatch(l.p,l.base,null);
  });
}
function custPerson(c){
  let p=S.people.find(x=>x.kind==='cust'&&x.name===c.name);
  if(!p){p={id:uid(),name:c.name,phone:c.phone||'',kind:'cust',amt:0,dir:'they',supplies:[]};S.people.push(p);}
  if(c.phone&&!p.phone)p.phone=c.phone;
  return p;
}

/* ================= البيع: تسجيل ================= */
function commitSale(lines,pay,cust,isRet){
  const amt=sumA(lines,l=>l.amt),cost=sumA(lines,l=>l.cost);
  const txt=lines.map(l=>l.qty+' '+l.un+' '+l.p.name).join('، ');
  snap(isRet?'مرتجع':'بيع');
  if(isRet){
    restore(lines);
    if(pay==='credit'){custPerson(cust).amt-=amt;logE({k:'ret',pay:'credit',amt,cost,title:'مرتجع: '+txt+' ('+cust.name+')'});}
    else if(pay==='cash'){logE({k:'ret',pay:'cash',amt,cost,title:'مرتجع: '+txt});}
    else{mach(pay).bal-=amt;logE({k:'ret',pay,amt,cost,title:'مرتجع: '+txt});}
  } else {
    consume(lines);
    if(pay==='credit'){const p=custPerson(cust);p.amt+=amt;logE({k:'sale',pay:'credit',amt,cost,title:'بيع: '+txt+' (آجل على '+p.name+')'});}
    else{if(pay!=='cash')mach(pay).bal+=amt;logE({k:'sale',pay,amt,cost,title:'بيع: '+txt});}
  }
  sync();render();
  toast((isRet?'اتسجل المرتجع':'اتباع')+' ✅',true);
}

let SCB=null,SC=null;
function scanFlow(mode){openScanner(c=>handleCode(c,mode));}
async function openScanner(cb){
  SCB=cb;
  $('scanSheet').classList.add('on');
  $('scanMsg').textContent='';$('scanFallback').style.display='none';$('scanIn').value='';
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return scanFallback('الكاميرا مش متاحة في المتصفح ده. اكتب الباركود، أو جرّب باركود تجريبي.');
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('vid');v.srcObject=st;await v.play();
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']});
    SC={st,timer:setInterval(async()=>{
      try{
        const r=await det.detect(v);
        if(r.length&&SC){const code=r[0].rawValue;endScan();if(SCB)SCB(code);}
      }catch(e){}
    },350)};
  }catch(e){scanFallback('ما قدرناش نفتح الكاميرا. اكتب الباركود يدوي.');}
}
function scanFallback(msg){$('scanMsg').textContent=msg;$('scanFallback').style.display='block';}
function endScan(){
  if(SC){clearInterval(SC.timer);SC.st.getTracks().forEach(t=>t.stop());SC=null;}
  $('scanSheet').classList.remove('on');
}
function scanTyped(){
  const c=$('scanIn').value.trim();
  if(!c)return toast('اكتب الباركود');
  endScan();if(SCB)SCB(c);
}

      <button class="btn ghost" onclick="closeSheet()">إلغاء</button>`);

  if(mode==='add')return buySheet(p);
  if(stockOf(p)<=0)return toast('ده خلص، مش هينفع تبيعه');

    </details>

      <div class="chips">${payChips('np',pay)}<span class="chip ${pay==='credit'?'on':''}" onclick="pickPay('np','credit')">📒 على مورد</span></div>
      ${pay==='credit'?`<input placeholder="اسم المورد" value="${esc(NP.supName)}" dir="auto" oninput="NP.supName=this.value"><input type="tel" placeholder="رقم المورد" value="${esc(NP.supPhone)}" oninput="NP.supPhone=this.value">`:''}`:''}
    <button class="btn" onclick="newProdSave()">حفظ المنتج ✅</button>`);

function newProdSave(){
  const t=NP.type,name=NP.name.trim();
  if(!name)return toast('اكتب اسم المنتج');
  const buy=Number(NP.buy)||0,sell=Number(NP.sell);
  if(!(sell>0))return toast('اكتب سعر البيع');
  const bc=NP.bc.trim();
  if(bc&&S.products.some(p=>p.bc===bc))return toast('الباركود ده موجود عند منتج تاني');
  const units=t==='weight'?[{l:'كيلو',b:1000,p:sell,c:buy}]:[{l:'قطعة',b:1,p:sell,c:buy}];
  if(t==='piece'&&NP.carton){
    if(!(Number(NP.cq)>0)||!(Number(NP.csell)>0))return toast('اكتب عدد الكرتونة وسعرها');
    units.push({l:'كرتونة ('+NP.cq+')',b:Number(NP.cq),p:Number(NP.csell),c:0});
  }
  const qty=Number(NP.qty)||0;
  const pay=getPay('np');
  let sup=null;
  if(qty>0&&pay==='credit'){
    sup=supplierFor(pay,'',NP.supName,NP.supPhone,null);
    if(sup==='NEED_NAME')return toast('اكتب اسم المورد');
  }
  if(qty>0&&pay!=='cash'&&pay!=='credit'&&mach(pay).bal<qty*buy)return toast('رصيد المحفظة مش كافي');
  const p={id:'p'+uid(),name,em:'📦',bc,kind:'item',weight:t==='weight',min:Number(NP.min)||(t==='weight'?1:5),units,batches:[],flavor:NP.flv,size:NP.size};
  snap('منتج: '+name);
  S.products.push(p);
  if(qty>0){
    const base=Math.round(qty*units[0].b);
    addBatch(p,base,NP.exp||null);
    if(pay==='cash')logE({k:'in',pay:'cash',cost:qty*buy,title:'دخلت: '+qty+' '+units[0].l+' '+name});
    else if(pay==='credit'){sup.amt+=qty*buy;sup.dir='me';if(!sup.supplies.includes(p.id))sup.supplies.push(p.id);logE({k:'in',pay:'credit',cost:qty*buy,title:'دخلت: '+qty+' '+units[0].l+' '+name+' (على '+sup.name+')'});}
    else{mach(pay).bal-=qty*buy;logE({k:'in',pay,cost:qty*buy,title:'دخلت: '+qty+' '+units[0].l+' '+name});}
  }
  sync();closeSheet();render();toast('اتحفظ المنتج ✅',true);
}

function sandSheet(id){

function swTotals(){
  const ing=SW.ing.filter(x=>x.pid);
  const base=sumA(ing,x=>{const q=prod(x.pid);return q?x.q*sellPer(q):0;});
  const cost=sumA(ing,x=>{const q=prod(x.pid);return q?x.q*costPer(q):0;})+(Number(SW.extra)||0);
  const price=base+(Number(SW.markup)||0);
  return{base,price,cost,profit:price-cost};
}
function drawSand(){
  const T=swTotals();

      <div><div class="lbl">تكلفة إضافية (ورق/علبة)</div><input type="number" inputmode="decimal" value="${SW.extra}" oninput="SW.extra=Number(this.value)||0;swUpd()"></div>
    </div>
    <div class="sumbox"><div class="line"><span>سعر المكونات</span><b id="swB">${fmt(T.base)}</b></div><div class="line"><span>سعر البيع</span><b id="swP">${fmt(T.price)}</b></div><div class="line"><span>التكلفة</span><b id="swC">${fmt(T.cost)}</b></div><div class="line" style="border:0"><span>ربحك في السندوتش</span><b id="swF">${fmt(T.profit)}</b></div></div>
    <button class="btn" onclick="sandSave()">حفظ السندوتش ✅</button>`);

function swUpd(){

function drDiff(){
  const v=$('drC').value,box=$('drD');
  if(v===''){box.innerHTML='<div class="note">اكتب اللي عدّيته عشان نشوف الفرق</div>';return;}

  box.innerHTML=`<div class="sumbox"><div class="line" style="border:0"><span>الفرق</span><b style="color:${diff===0?'var(--green)':'var(--red)'}">${diff===0?'مطابق ✅':(diff>0?'+':'')+fmt(diff)}</b></div></div>`
    +(diff?'<div class="note">لو ناقص: شوف الحركات اللي تحت. غالباً مصروف ما اتسجلش، أو فكة، أو بيع كاش ما اتسجلش.</div>':'');
}
function drawerClose(){
  const v=$('drC').value;
  if(v==='')return toast('اكتب اللي عدّيته');
  const c=Number(v),diff=c-drawerNow().expected;
  snap('قفل الدرج');
  logE({k:'close',title:'قفل الدرج',amt:c,sub:diff?'فرق '+fmt(diff):'مطابق'});
  S.drawer={base:c,since:Date.now()};
  render();
  toast(diff?'اتقفل الدرج، والفرق '+fmt(diff):'اتقفل الدرج، مطابق ✅',true);
}

let CHAT=[];
function chatPage(){
  return `<h2 class="h2">اسأل حسبة</h2>

  <div class="chatIn"><input id="chatQ" placeholder="اسأل أي حاجة..." dir="auto" onkeydown="if(event.key==='Enter')chatAsk()"><button onclick="chatAsk()">إرسال</button></div>`;

function chatAsk(q){
  q=(q||$('chatQ').value||'').trim();
  if(!q)return;
  CHAT.push({r:'u',t:q});CHAT.push({r:'b',t:askAns(q)});
  render();
}
function askAns(t){
  const has=(...w)=>w.some(x=>t.includes(x));
  const d=sumOf(S.log.filter(e=>e.t>=sod(Date.now())));
  if(has('بعت'))return 'بعت النهارده بـ '+fmt(d.sales)+'.';
  if(has('ربح'))return 'ربحك النهارده '+fmt(d.profit)+'.';
  if(has('درج','كاش'))return 'المفروض في الدرج دلوقتي '+fmt(drawerNow().expected)+'.';
  if(has('خلص','ناقص')){const o=S.products.filter(p=>p.kind==='item'&&stockOf(p)<=0).map(p=>esc(p.name));return o.length?'خلصانين: '+o.join('، ')+'.':'مفيش حاجة خلصت ✅';}
  if(has('عليا','عليّ')){const L=S.people.filter(p=>p.dir==='me'&&p.amt>0);return L.length?L.map(p=>esc(p.name)+': '+fmt(p.amt)).join('<br>'):'مفيش فلوس عليك ✅';}
  if(has('عليه','ليا')){const L=S.people.filter(p=>p.dir==='they'&&p.amt>0);return L.length?L.map(p=>esc(p.name)+': '+fmt(p.amt)).join('<br>'):'مفيش حد عليه فلوس ليك';}
  if(has('فودافون','إنستا','محفظ','رصيد'))return S.machines.map(m=>esc(m.name)+': '+fmt(m.bal)).join('<br>');
  return 'مش فاهم السؤال ده لسه. جرّب تسأل عن البيع أو الربح أو الدرج أو اللي خلص.';
}

/* ================= التنقل والعرض ================= */
const PAGES={home:homePage,sell:sellPage,add:addPage,exp:expPage,people:peoplePage,machines:machPage,stock:stockPage,inv:invPage,drawer:drawerPage,reports:reportsPage,chat:chatPage,login:loginPage};
const TITLES={home:'حِسبة',sell:'بيع حاجة',add:'دخلت بضاعة',exp:'صرفت فلوس',people:'حسابات الناس',machines:'المحافظ والماكينات',stock:'بضاعتي',inv:'الجرد',drawer:'الدرج',reports:'التقارير',chat:'اسأل حسبة',login:'حِسبة'};
let SCR='login',NAV=[];
function go(s,push=true){
  if(!AUTH&&s!=='login')s='login';
  if(push&&SCR!==s&&SCR!=='login')NAV.push(SCR);
  SCR=s;
  render();
  window.scrollTo(0,0);
}
function back(){go(NAV.pop()||'home',false);}
function render(){
  if(!AUTH)SCR='login';
  sync();
  $('page').innerHTML=PAGES[SCR]();
  $('ttl').textContent=TITLES[SCR]||'حِسبة';
  $('shopN').textContent=S.shop;
  $('hdr').style.display=AUTH?'flex':'none';
  $('back').style.display=(AUTH&&SCR!=='home')?'flex':'none';
  fixDir();
}
// كل الحقول (ما عدا الباسورد) بتقبل العربي والإنجليزي
function fixDir(){document.querySelectorAll('input:not([type=password])').forEach(i=>{if(i.dir!=='auto')i.dir='auto';});}
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&t.type!=='password'&&t.dir!=='auto')t.dir='auto';});

let TT;
function openSheet(html){$('sheetBody').innerHTML=html;$('sheet').classList.add('on');fixDir();}
function closeSheet(){$('sheet').classList.remove('on');}
function toast(m,undoable){
  const t=$('toast');
  t.innerHTML=esc(m)+(undoable&&HIST.length?' <button onclick="undo()">↩️ تراجع</button>':'');
  t.classList.add('on');clearTimeout(TT);
  TT=setTimeout(()=>t.classList.remove('on'),undoable?4000:1800);
}
function toggleTheme(){
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;
  $('thBtn').textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('hesba_theme',t);}catch(e){}
}
function netUI(){$('offBar').classList.toggle('on',!navigator.onLine);}
window.addEventListener('offline',netUI);window.addEventListener('online',netUI);

/* ================= بيانات تجريبية للتقارير ================= */
(function seedHistory(){
  const now=Date.now();
  const sellable=S.products.filter(p=>p.kind==='item'&&p.units[0].p<100);
  for(let i=1;i<=40;i++){
    const p=sellable[i%sellable.length],u=p.units[0],q=1+(i%3);
    const pay=['cash','cash','vc','ip'][i%4];
    logE({k:'sale',pay,t:now-i*3*3600e3,amt:q*u.p,cost:q*u.c,title:'بيع: '+q+' '+u.l+' '+p.name});
  }
  for(let i=1;i<=5;i++)logE({k:'exp',pay:'cash',t:now-i*DAY*1.5,amt:50+i*20,title:'صرف: كهرباء'});
})();

/* ================= بداية ================= */
try{const th=localStorage.getItem('hesba_theme');if(th){document.documentElement.dataset.theme=th;$('thBtn').textContent=th==='dark'?'☀️':'🌙';}}catch(e){}
netUI();
sync();
render();
</script>
