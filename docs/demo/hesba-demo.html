<style>
:root{--bg:#EFE8D6;--sf:#FBF8EF;--sf2:#F5F0E1;--ink:#2B2A22;--ink2:#6E6A58;--line:#DDD4BC;--br:#4F6B46;--br2:#3F5937;--brInk:#fff;--soft:#E1E8D4;--red:#B3402F;--redBg:#F7E0D9;--yel:#B8841A;--yelBg:#F6EAC4;--yelLine:#D9A92E;--ok:#4F6B46;--sh:0 1px 2px rgba(60,50,20,.06),0 4px 14px rgba(60,50,20,.06);--sh2:0 10px 40px rgba(40,30,10,.22);--r:14px;--nav:66px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1B1A15;--sf:#25241D;--sf2:#2D2B23;--ink:#EFE8D6;--ink2:#A9A28C;--line:#3A382D;--br:#9DBB8B;--br2:#B4CFA5;--brInk:#1B1A15;--soft:#33402D;--red:#E58B79;--redBg:#43241E;--yel:#E0B04B;--yelBg:#43391C;--yelLine:#B98F2D;--ok:#9DBB8B;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 10px 40px rgba(0,0,0,.55)}}
:root[data-theme=dark]{--bg:#1B1A15;--sf:#25241D;--sf2:#2D2B23;--ink:#EFE8D6;--ink2:#A9A28C;--line:#3A382D;--br:#9DBB8B;--br2:#B4CFA5;--brInk:#1B1A15;--soft:#33402D;--red:#E58B79;--redBg:#43241E;--yel:#E0B04B;--yelBg:#43391C;--yelLine:#B98F2D;--ok:#9DBB8B;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 10px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.5}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{width:100%;background:var(--sf);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--br);box-shadow:0 0 0 3px color-mix(in srgb,var(--br) 22%,transparent)}
input:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.ic{flex:none}.sp{flex:1}.muted{color:var(--ink2)}.hide-m{}.only-m{display:block}.only-d{display:none}
em{font-style:normal}
/* shell */
.app{min-height:100vh;display:block}
.side{display:none}
.main{min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.t-logo{display:flex}.logo{display:block;width:auto}
.content{padding:14px 14px calc(var(--nav) + 40px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.ib{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none}
.ib:hover{background:var(--sf2)}.ib.sm{width:34px;height:34px;border-radius:10px;color:var(--ink2)}.ib.act{background:var(--soft);color:var(--br)}
.hb em,.nv em,.bn-i em,.mi-ic em{position:absolute;top:3px;inset-inline-start:2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.mic.rec{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 25%,transparent)}}
.smenu{position:relative}
.store-btn{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border-radius:12px;font-weight:800;max-width:62vw}
.store-btn:hover{background:var(--sf2)}
.s-ic{width:32px;height:32px;border-radius:10px;background:var(--br);color:var(--brInk);display:flex;align-items:center;justify-content:center}
.s-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{transition:transform .2s}.chev.up{transform:rotate(180deg)}
.off-dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.menu-shield{position:fixed;inset:0;z-index:40}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;width:min(330px,92vw);background:var(--sf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);z-index:41;padding:8px;animation:pop .16s}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.mn-h{padding:8px 10px 10px;display:flex;flex-direction:column}.mn-h small{color:var(--ink2)}
.mn-s{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mn-l{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--ink2);font-size:14px}
.mn-sync{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.mn-i{display:flex;gap:8px;align-items:center;width:100%;padding:12px 10px;border-radius:10px;border-top:1px solid var(--line);border-radius:0;font-weight:700}
.mn-i:hover{background:var(--sf2)}.mn-i.danger{color:var(--red)}
.syncbar{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:14px;font-weight:700}
.syncbar.off{background:var(--redBg);color:var(--red)}.syncbar.busy{background:var(--yelBg);color:var(--yel)}.syncbar.ok{background:var(--soft);color:var(--br)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(-360deg)}}
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:35;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--sf);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);font-size:12px;font-weight:700;position:relative}
.bn.on{color:var(--br)}.bn-i{position:relative;display:flex}
.bn.sell .sell-c{width:56px;height:56px;border-radius:50%;background:var(--br);color:var(--brInk);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 18px color-mix(in srgb,var(--br) 45%,transparent);border:4px solid var(--bg)}
.bn.sell{color:var(--br)}
.more-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.more-i{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:16px;background:var(--sf2);font-weight:800}
.mi-ic{position:relative;width:52px;height:52px;border-radius:16px;background:var(--soft);color:var(--br);display:flex;align-items:center;justify-content:center}
@media(min-width:900px){
 .app{display:grid;grid-template-columns:230px 1fr}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--sf);border-inline-end:1px solid var(--line);padding:16px 12px}
 .sd-logo{padding:4px 8px 16px;display:flex}.t-logo{display:none}.bnav{display:none}
 .side nav{display:flex;flex-direction:column;gap:4px}
 .nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-weight:700;color:var(--ink2);position:relative;text-align:start}
 .nv:hover{background:var(--sf2)}.nv.on{background:var(--soft);color:var(--br)}
 .nv.key{background:var(--br);color:var(--brInk);margin:6px 0}.nv.key.on{background:var(--br2)}
 .nv em{position:static;margin-inline-start:auto}
 .content{padding:22px 28px 60px}.only-m{display:none}.only-d{display:block}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
