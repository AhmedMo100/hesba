services:
  postgres:
    image: postgres:16-alpine
    container_name: hesba_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-local-root
      POSTGRES_DB: postgres
    ports:
      - "${HESBA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - hesba_pgdata:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro

volumes:
  hesba_pgdata:
