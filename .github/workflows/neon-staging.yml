name: Neon Staging Verification

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"

jobs:
  verify:
    name: Neon Staging Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrate deploy against Neon (Run 1)
        env:
          HESBA_DATABASE_URL: ${{ secrets.HESBA_DATABASE_URL }}
          HESBA_DIRECT_URL: ${{ secrets.HESBA_DIRECT_URL }}
        run: pnpm db:migrate

      - name: Run Prisma migrate deploy against Neon (Run 2 - No-op check)
        env:
          HESBA_DATABASE_URL: ${{ secrets.HESBA_DATABASE_URL }}
          HESBA_DIRECT_URL: ${{ secrets.HESBA_DIRECT_URL }}
        run: pnpm db:migrate

      - name: Verify hesba_migrator and hesba_app roles on Neon
        env:
          HESBA_DIRECT_URL: ${{ secrets.HESBA_DIRECT_URL }}
        run: npx tsx scripts/verify-neon.ts

      - name: Run cross-tenant integration tests against Neon staging
        env:
          HESBA_DATABASE_URL: ${{ secrets.HESBA_DATABASE_URL }}
          HESBA_DIRECT_URL: ${{ secrets.HESBA_DIRECT_URL }}
        run: pnpm test:int

      - name: Run market seed dry run against Neon
        env:
          HESBA_DATABASE_URL: ${{ secrets.HESBA_DATABASE_URL }}
          HESBA_DIRECT_URL: ${{ secrets.HESBA_DIRECT_URL }}
        run: pnpm catalog:import data/catalog/templates/ --dry-run

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start app and test /api/health/ready & Sentry telemetry
        env:
          HESBA_DATABASE_URL: ${{ secrets.HESBA_DATABASE_URL }}
          HESBA_DIRECT_URL: ${{ secrets.HESBA_DIRECT_URL }}
          HESBA_SESSION_SECRET: ${{ secrets.HESBA_SESSION_SECRET }}
          HESBA_CRON_SECRET: ${{ secrets.HESBA_CRON_SECRET }}
          HESBA_SENTRY_DSN: ${{ secrets.HESBA_SENTRY_DSN }}
          HESBA_APP_ORIGIN: http://localhost:3000
          PORT: 3000
        run: |
          pnpm start > server.log 2>&1 &
          SERVER_PID=$!
          echo "App started with PID $SERVER_PID. Polling /api/health/ready..."
          READY=0
          for i in {1..30}; do
            RESPONSE=$(curl -s http://localhost:3000/api/health/ready || true)
            if echo "$RESPONSE" | grep -q '"status":"ready"'; then
              echo "Health readiness check PASSED:"
              echo "$RESPONSE"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Health check failed to become ready in 30s. Server log:"
            cat server.log
            kill $SERVER_PID
            exit 1
          fi

          kill $SERVER_PID
          exit 0
