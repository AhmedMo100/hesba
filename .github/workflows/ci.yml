name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Static lint & import boundaries
        run: pnpm lint

      - name: Strict TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit & property tests
        run: pnpm test

      - name: Next.js standalone build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          HESBA_SESSION_SECRET: hesba-test-session-secret-at-least-16-chars
          HESBA_CRON_SECRET: hesba-test-cron-secret
          HESBA_APP_ORIGIN: http://localhost:3000

      - name: Verify Docker build portability
        run: docker build -t hesba:ci .

  integration:
    name: Database Migrations & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me-local-root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Initialize PostgreSQL roles & database
        run: |
          PGPASSWORD=change-me-local-root psql -h localhost -p 5432 -U postgres -d postgres -f scripts/sql/00-roles.sql

      - name: Run Prisma migrations against service container
        env:
          HESBA_DATABASE_URL: postgres://hesba_app:change-me-local@localhost:5432/hesba
          HESBA_DIRECT_URL: postgres://hesba_migrator:change-me-local@localhost:5432/hesba
        run: pnpm db:migrate

      - name: Run cross-tenant integration tests
        env:
          HESBA_DATABASE_URL: postgres://hesba_app:change-me-local@localhost:5432/hesba
          HESBA_DIRECT_URL: postgres://hesba_migrator:change-me-local@localhost:5432/hesba
          HESBA_SESSION_SECRET: hesba-test-session-secret-at-least-16-chars
          HESBA_CRON_SECRET: hesba-test-cron-secret
          HESBA_APP_ORIGIN: http://localhost:3000
        run: pnpm test:int
